/**:
  ros__parameters:
    allow_duplicate_names: True

attention_server:
  ros__parameters:
    period: 0.05
    max_yaw: 1.3
    max_pitch: 0.3
    max_vel_yaw: 1.75 
    max_vel_pitch: 1.75
    rotation_threshold: 0.436332 # 25 degrees
    
perception_people_detection:
  ros__parameters:
    target_frame: base_footprint
    debug: true

perception_objects_detection:
  ros__parameters:
    target_frame: base_footprint
    debug: true

